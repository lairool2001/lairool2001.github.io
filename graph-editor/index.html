<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta http-equiv="content-language" content="zh-tw">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="js.cookie.min.js"></script>
    <link rel="Stylesheet" type="text/css" href="css/jPicker-1.1.6.min.css" />
    <link rel="Stylesheet" type="text/css" href="jPicker.css" />
    <script src="jpicker-1.1.6.min.js" type="text/javascript"></script>
    <title id="text10">圖型編輯器</title>
    <style type="text/css">
        :root {
            --ink: #0f172a;
            --ink-2: #334155;
            --muted: #64748b;
            --faint: #94a3b8;
            --line: rgba(15, 23, 42, 0.08);
            --line-strong: rgba(15, 23, 42, 0.14);
            --surface: rgba(255, 255, 255, 0.86);
            --surface-solid: #ffffff;
            --field: #f8fafc;
            --canvas: #f4f6fb;
            --grid-dot: #d3d9e6;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: #eef2ff;
            --accent-ring: rgba(79, 70, 229, 0.22);
            --danger: #e11d48;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 12px 32px -12px rgba(15, 23, 42, 0.28);
            --sidebar-w: 312px;
            --gap: 12px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
            --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--canvas);
            color: var(--ink);
            font-family: var(--font);
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
            color: inherit;
        }

        /* ───────── 畫布 ───────── */
        #div_right {
            padding: 0px;
            margin: 0px;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -o-user-select: none;
        }

        #svg1 {
            background-color: var(--canvas);
            background-image: radial-gradient(var(--grid-dot) 1.2px, transparent 1.4px);
            background-size: 24px 24px;
            margin: 0 auto;
            width: 100vw;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 0;
            position: fixed;
            cursor: default;
        }

        #svg1.panning {
            cursor: grabbing;
        }

        #svg1 rect {
            rx: 10px;
            ry: 10px;
            cursor: grab;
            transition: filter 0.15s ease;
        }

        #svg1 rect:not(.selected) {
            filter: drop-shadow(0 1px 1.5px rgba(15, 23, 42, 0.12));
        }

        #svg1 line {
            cursor: pointer;
            stroke-linecap: round;
            transition: filter 0.15s ease;
        }

        #svg1.line-hover {
            cursor: pointer;
        }

        #svg1 line:hover,
        #svg1 line.hover {
            filter: drop-shadow(0 0 2px rgba(79, 70, 229, 0.55));
        }

        .rect1_text {
            text-anchor: middle;
            font-size: 20px;
            font-family: "Microsoft JhengHei";
            font-weight: 500;
            cursor: grab;
        }

        /*選取中的方塊或線條發亮*/
        #svg1 .selected,
        #svg1 line.selected {
            filter: drop-shadow(0 0 2px #6366f1) drop-shadow(0 0 7px rgba(99, 102, 241, 0.75));
        }

        /* ───────── 側邊欄 ───────── */
        #div_left {
            position: fixed;
            z-index: 10;
            top: var(--gap);
            left: var(--gap);
            bottom: var(--gap);
            width: var(--sidebar-w);
            display: flex;
            flex-direction: column;
            background: var(--surface);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            backdrop-filter: blur(18px) saturate(1.4);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
        }

        body.sidebar-closed #div_left {
            transform: translateX(calc(-100% - var(--gap) * 2));
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 14px 12px 16px;
            border-bottom: 1px solid var(--line);
        }

        .logo {
            width: 30px;
            height: 30px;
            flex: none;
            border-radius: 9px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 4px 12px -4px rgba(99, 102, 241, 0.7);
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: 0.01em;
            flex: 1;
        }

        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px 14px 14px;
            scrollbar-width: thin;
            scrollbar-color: var(--line-strong) transparent;
        }

        .section {
            padding: 14px 2px;
            border-bottom: 1px solid var(--line);
        }

        .section:last-child {
            border-bottom: none;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 10px;
            font-size: 11px;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .field {
            display: block;
            margin-bottom: 10px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
            font-weight: 550;
            color: var(--ink-2);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 32px;
        }

        .row + .row {
            margin-top: 4px;
        }

        .row > span {
            color: var(--ink-2);
            font-weight: 500;
        }

        textarea,
        input[type="number"],
        input[type="text"]:not(.ColorPick) {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-sm);
            background: var(--field);
            outline: none;
            resize: none;
            line-height: 1.45;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        textarea:hover,
        input[type="number"]:hover {
            border-color: rgba(15, 23, 42, 0.24);
        }

        textarea:focus,
        input[type="number"]:focus {
            background: var(--surface-solid);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        #t1 {
            height: 38px;
            font-size: 14px;
            font-weight: 550;
        }

        #t2 {
            height: 84px;
            resize: vertical;
            min-height: 60px;
        }

        #t1:read-only,
        #t2:read-only {
            background: transparent;
            border-style: dashed;
            color: var(--faint);
            cursor: not-allowed;
            box-shadow: none;
        }

        #searchText,
        #t3 {
            height: 36px;
            white-space: nowrap;
            overflow: hidden;
        }

        .search-wrap {
            position: relative;
        }

        .search-wrap svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--faint);
            pointer-events: none;
        }

        .search-wrap #searchText {
            padding-left: 32px;
        }

        #myNumber {
            width: 76px;
            text-align: center;
            padding: 6px 8px;
        }

        /* 按鈕 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 36px;
            padding: 0 14px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-sm);
            background: var(--surface-solid);
            color: var(--ink);
            font-weight: 550;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
        }

        .btn:hover {
            background: var(--field);
            border-color: rgba(15, 23, 42, 0.22);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:focus-visible,
        .icon-btn:focus-visible,
        .seg button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 6px 16px -8px rgba(79, 70, 229, 0.9);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .btn-primary kbd {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.28);
            color: #fff;
        }

        .btn-block {
            width: 100%;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-grid .btn {
            padding: 0 10px;
            font-size: 12.5px;
        }

        .btn-grid .btn.wide {
            grid-column: span 2;
        }

        .icon-btn {
            width: 30px;
            height: 30px;
            flex: none;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .icon-btn:hover {
            background: rgba(15, 23, 42, 0.06);
            color: var(--ink);
        }

        /* 分段控制：線條類型 */
        .seg {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
            padding: 3px;
            border-radius: var(--radius-sm);
            background: rgba(15, 23, 42, 0.05);
        }

        .seg button {
            height: 34px;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--ink-2);
            font-size: 11.5px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }

        .seg button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.7);
        }

        .seg button.active {
            background: var(--surface-solid);
            color: var(--accent);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.14);
        }

        .seg button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .hint {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        kbd {
            display: inline-grid;
            place-items: center;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border: 1px solid var(--line-strong);
            border-bottom-width: 2px;
            border-radius: 6px;
            background: var(--surface-solid);
            color: var(--ink-2);
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 600;
            line-height: 1;
        }

        /* 快捷鍵清單 */
        details.help summary {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            color: var(--muted);
            font-weight: 550;
            cursor: pointer;
            user-select: none;
        }

        details.help summary::-webkit-details-marker {
            display: none;
        }

        details.help summary svg {
            transition: transform 0.2s ease;
        }

        details.help[open] summary svg {
            transform: rotate(90deg);
        }

        .shortcuts {
            list-style: none;
            margin: 10px 0 0;
            padding: 0;
        }

        .shortcuts li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 5px 0;
            color: var(--ink-2);
        }

        .shortcuts li span:last-child {
            display: flex;
            gap: 4px;
            flex: none;
        }

        /* 獨立/複數徽章 */
        #text15:empty {
            display: none;
        }

        #text15 {
            display: inline-flex;
            align-items: center;
            height: 20px;
            padding: 0 8px;
            border-radius: 999px;
            border: 1px solid currentColor;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0.85;
        }

        /* 色彩選擇列 */
        .ColorPick {
            width: 76px;
            height: 26px;
            padding: 0 4px;
            border: 1px solid var(--line-strong);
            border-radius: 7px;
            font-family: var(--mono);
            font-size: 11px;
            text-align: center;
            text-transform: uppercase;
            outline: none;
        }

        .color-row .jPicker .Icon {
            vertical-align: middle;
            margin-left: 4px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 0 1px var(--line-strong);
        }

        .color-row > span:last-child {
            display: flex;
            align-items: center;
        }

        /* 檔案 */
        #file1 {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* 開關 */
        .switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            color: var(--ink-2);
            font-weight: 500;
        }

        .switch input {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            width: 36px;
            height: 20px;
            margin: 0;
            border-radius: 999px;
            background: #cbd5e1;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .switch input::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.3);
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .switch input:checked {
            background: var(--accent);
        }

        .switch input:checked::after {
            transform: translateX(16px);
        }

        .switch input:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        /* ───────── 畫布浮動元件 ───────── */
        .floating {
            position: fixed;
            z-index: 9;
            background: var(--surface);
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        #openSidebar {
            top: var(--gap);
            left: var(--gap);
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            color: var(--ink-2);
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        body.sidebar-closed #openSidebar {
            opacity: 1;
            pointer-events: auto;
        }

        /* 縮放工具列 */
        #zoomBar {
            right: var(--gap);
            bottom: var(--gap);
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 4px;
        }

        #zoomLabel {
            min-width: 56px;
            height: 30px;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-2);
            cursor: pointer;
        }

        #zoomLabel:hover {
            background: rgba(15, 23, 42, 0.06);
        }

        .zoom-sep {
            width: 1px;
            height: 18px;
            margin: 0 3px;
            background: var(--line-strong);
        }

        /* 已選方塊與鄰居 */
        #div_center_bottom {
            left: calc(var(--sidebar-w) + var(--gap) * 2);
            right: calc(var(--gap) + 200px);
            bottom: var(--gap);
            width: max-content;
            max-width: calc(100vw - var(--sidebar-w) - 240px);
            margin: 0 auto;
            padding: 10px 14px;
            transition: left 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease, transform 0.2s ease;
        }

        body.sidebar-closed #div_center_bottom {
            left: calc(var(--gap) + 52px);
            max-width: calc(100vw - 280px);
        }

        #div_center_bottom:has(#around_text:empty) {
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }

        #around_text {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            max-height: 30vh;
            overflow-y: auto;
        }

        .sel-name {
            font-weight: 650;
            font-size: 14px;
            margin-right: 2px;
        }

        .sel-meta {
            color: var(--muted);
            font-size: 12px;
            margin-right: 4px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            height: 24px;
            padding: 0 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 12px;
            font-weight: 550;
        }

        /* 訊息提示 */
        #info {
            position: fixed;
            z-index: 11;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.88);
            color: #fff;
            font-size: 12.5px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 10px 24px -10px rgba(15, 23, 42, 0.6);
            pointer-events: none;
            opacity: 0;
        }

        /* 拖放檔案 */
        #dropOverlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            background: rgba(79, 70, 229, 0.08);
            border: 3px dashed var(--accent);
            color: var(--accent);
            font-size: 18px;
            font-weight: 650;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        body.dragging-file #dropOverlay {
            opacity: 1;
        }

        #loadDiv {
            display: none;
        }

        @media (max-width: 640px) {
            :root {
                --sidebar-w: calc(100vw - 24px);
            }

            #div_center_bottom {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }

    </style>
</head>

<body onkeydown="body_onkeydown(event);" onkeyup="body_onkeyup(event);">
    <audio id="lineAudio" src="sound/18V_Cordless_Drill_Switch.mp3"></audio>
    <audio id="deletaAudio" src="sound/Air_Woosh_Underwater.mp3"></audio>
    <audio id="createAudio" src="sound/Beep_Short.mp3"></audio>
    <aside id="div_left">
        <header class="sidebar-header">
            <div class="logo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect><path d="M10 6.5h4.5a2 2 0 0 1 2 2V14"></path></svg>
            </div>
            <h1 id="appTitle">圖型編輯器</h1>
            <button class="icon-btn" onclick="toggleSidebar(false);" id="closeSidebar" title="收合側邊欄">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16M15.5 10l-2 2 2 2"></path></svg>
            </button>
        </header>
        <div class="sidebar-body">
            <section class="section">
                <button class="btn btn-primary" onclick="create_onclick(this,event);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                    <span id="text8">在中央創造方塊</span>
                    <kbd>C</kbd>
                </button>
                <details class="help">
                    <summary>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
                        <span id="helpTitle">操作說明與快捷鍵</span>
                    </summary>
                    <ul class="shortcuts" id="text1">
                        <li><span>選取 / 拖曳方塊</span><span><kbd>左鍵</kbd></span></li>
                        <li><span>連線兩個方塊</span><span><kbd>右鍵</kbd><kbd>右鍵</kbd></span></li>
                        <li><span>移動畫布</span><span><kbd>右鍵拖曳</kbd><kbd>WASD</kbd></span></li>
                        <li><span>縮放畫布</span><span><kbd>滾輪</kbd></span></li>
                        <li><span>刪除方塊或連線</span><span><kbd>Del</kbd></span></li>
                        <li><span>切換箭頭類型</span><span><kbd>T</kbd></span></li>
                        <li><span>搜尋 / 名稱 / 資料</span><span><kbd>F</kbd><kbd>F2</kbd><kbd>F3</kbd></span></li>
                        <li><span>儲存到本地</span><span><kbd>Q</kbd></span></li>
                    </ul>
                </details>
            </section>

            });

        var ZOOM_MIN = 0.2,
            ZOOM_MAX = 4;
        /**目前畫面縮放比例(螢幕px / SVG單位)*/
        function getZoom() {
            let vb = svg1.viewBox.baseVal;
            return Math.min(svg1.clientWidth / vb.width, svg1.clientHeight / vb.height);
        }
        /**以螢幕座標為中心縮放畫布*/
        function zoomAt(factor, clientX, clientY) {
            let vb = svg1.viewBox.baseVal;
            let zoom = getZoom();
            let target = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom * factor));
            factor = target / zoom;
            if (factor == 1) return;
            let pt = svg1.createSVGPoint();
            pt.x = clientX;
            pt.y = clientY;
            let p = pt.matrixTransform(svg1.getScreenCTM().inverse());
            let w = vb.width / factor,
                h = vb.height / factor;
            let x = p.x - (p.x - vb.x) / factor,
                y = p.y - (p.y - vb.y) / factor;
            svg1.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
        }
        /**可見畫布區域的中心(扣掉側邊欄)*/
        function visibleCenter() {
            let left = sidebarOffset();
            return {
                x: left + (window.innerWidth - left) / 2,
                y: window.innerHeight / 2
            };
        }
        /**按鈕縮放*/
        function zoomBy(factor) {
            let c = visibleCenter();
            zoomAt(factor, c.x, c.y);
        }
        /**重設為100%*/
        function zoomReset() {
            let c = visibleCenter();
            zoomAt(1 / getZoom(), c.x, c.y);
        }
        /**滾輪縮放*/
        function on_wheel(event) {
            event.preventDefault();
            let factor = Math.exp(-event.deltaY * (event.ctrlKey ? 0.01 : 0.0015));
            zoomAt(factor, event.clientX, event.clientY);
        }
        /**側邊欄占用的螢幕寬度*/
        function sidebarOffset() {
            if (document.body.classList.contains('sidebar-closed') || window.innerWidth <= 640) return 0;
            return div_left.getBoundingClientRect().right;
        }
        /**讓所有內容顯示在可見區域內*/
        function fitView() {
            let W = svg1.clientWidth,
                H = svg1.clientHeight;
            let box;
            try {
                box = svg1.getBBox();
            } catch {
                return;
            }
            if (!W || !H || !box || (box.width == 0 && box.height == 0)) return;
            let left = sidebarOffset(),
                pad = 64;
            let availW = Math.max(100, W - left - pad * 2),
                availH = Math.max(100, H - pad * 2);
            let s = Math.min(availW / box.width, availH / box.height, 1.25);
            s = Math.max(ZOOM_MIN, s);
            let x = box.x - (left + pad + (availW - box.width * s) / 2) / s;
            let y = box.y - (pad + (availH - box.height * s) / 2) / s;
            svg1.setAttribute('viewBox', `${x} ${y} ${W / s} ${H / s}`);
        }
        /**同步背景格點位置與縮放標籤*/
        function syncCanvasChrome() {
            if (!window.svg1 || !svg1.getScreenCTM) return;
            let ctm = svg1.getScreenCTM();
            if (!ctm) return;
            let size = 24 * ctm.a;
            while (size < 12) size *= 2;
            svg1.style.backgroundSize = `${size}px ${size}px`;
            svg1.style.backgroundPosition = `${ctm.e}px ${ctm.f}px`;
            zoomLabel.textContent = Math.round(getZoom() * 100) + '%';

        /**線條點擊判定範圍(螢幕px，線條兩側各多少)*/
        var LINE_HIT_TOLERANCE = 8;
        /**找出螢幕座標附近最近的線條，沒有的話返回null*/
        function findLineNear(clientX, clientY) {
            let ctm = svg1.getScreenCTM();
            if (!ctm) return null;
            let best = null,
                bestDist = Infinity;
            svg1.querySelectorAll("line").forEach(l => {
                let p = svg1.createSVGPoint();
                p.x = l.x1.baseVal.value;
                p.y = l.y1.baseVal.value;
                let a = p.matrixTransform(ctm);
                p.x = l.x2.baseVal.value;
                p.y = l.y2.baseVal.value;
                let b = p.matrixTransform(ctm);
                let dist = distanceToSegment(clientX, clientY, a, b);
                let halfWidth = (parseFloat(l.getAttribute("stroke-width")) || 2) * ctm.a / 2;
                if (dist <= halfWidth + LINE_HIT_TOLERANCE && dist < bestDist) {
                    best = l;
                    bestDist = dist;
                }
            });
            return best;
        }
        /**點到線段的距離*/
        function distanceToSegment(px, py, a, b) {
            let dx = b.x - a.x,
                dy = b.y - a.y;
            let len2 = dx * dx + dy * dy;
            let t = len2 == 0 ? 0 : Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / len2));
            return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
        }

                if (l != line) l.classList.remove("hover");
            });
            if (line) line.classList.add("hover");
            svg1.classList.toggle("line-hover", line != null);
        }

        /**線條類型：無、左邊(起點)箭頭、右邊(終點)箭頭、雙向箭頭*/
        var LINE_ARROW_TYPES = ["none", "start", "end", "both"];
        /**確保畫布內有箭頭標記定義(舊存檔可能沒有)*/
        function ensureArrowDefs() {
            if (document.getElementById("arrow")) {
                return;
            }
            svg1.insertAdjacentHTML("afterbegin", `<defs id="arrowDefs"><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"></path></marker></defs>`);
        }
        /**取得線條類型，輸入請用線實體*/
        function getLineArrowType(l) {
            return l.getAttribute("data-arrow") || "none";
        }
        /**設定線條類型，輸入請用線實體*/
        function setLineArrowType(l, type) {
            l.setAttribute("data-arrow", type);
            if (type == "start" || type == "both") {
                l.setAttribute("marker-start", "url(#arrow)");
            } else {
                l.removeAttribute("marker-start");
            }
            if (type == "end" || type == "both") {
                l.setAttribute("marker-end", "url(#arrow)");
            } else {
                l.removeAttribute("marker-end");
            }
            //舊線條端點在方塊中心，箭頭會被蓋住，重新計算到方塊邊緣
            let k = getAB(l);
            if (k && k.aBlock && k.bBlock) {
                let ra = document.getElementById(k.aBlock.rectId);
                let rb = document.getElementById(k.bBlock.rectId);

                }

        /**顯示線條類型訊息*/
        function showLineArrowTypeInfo(type) {

        /**取得從方塊中心往目標點方向與方塊邊緣的交點*/
        function getRectEdgePoint(rect, from, to) {
            let dx = to.x - from.x;
            let dy = to.y - from.y;
            if (dx == 0 && dy == 0) {
                return from;
            }
            let hw = parseFloat(rect.getAttributeNS(null, 'width')) / 2;
            let hh = parseFloat(rect.getAttributeNS(null, 'height')) / 2;
            let t = Math.min(dx != 0 ? hw / Math.abs(dx) : Infinity, dy != 0 ? hh / Math.abs(dy) : Infinity);
            return {
                x: from.x + dx * t,
                y: from.y + dy * t
            };
        }
        /**設定線條兩端到兩個方塊的邊緣，讓箭頭不會被方塊蓋住*/
        function setLinePosition(l, rectA, rectB) {
            let pa = getMiddle(rectA);
            let pb = getMiddle(rectB);
            let ea = getRectEdgePoint(rectA, pa, pb);
            let eb = getRectEdgePoint(rectB, pb, pa);
            l.setAttributeNS(null, 'x1', ea.x);
            l.setAttributeNS(null, 'y1', ea.y);
            l.setAttributeNS(null, 'x2', eb.x);
            l.setAttributeNS(null, 'y2', eb.y);
        }
        /**得到AB組，輸入請使用線實體*/
        function getAB(l) {

        /**根據mouse_event(未設定的話自動視為0,0)獲得SVG式滑鼠座標*/
        function getMouseOnSvg() {
            if (mouse_event == undefined) {
                return {
                    x: 0,
                    y: 0
                };
            }
            let startClient = {
                x: mouse_event.clientX,
                y: mouse_event.clientY
            }
            let newSVGPoint = svg1.createSVGPoint()
            let CTM = svg1.getScreenCTM()
            newSVGPoint.x = startClient.x
            newSVGPoint.y = startClient.y
            let startSVGPoint = newSVGPoint.matrixTransform(CTM.inverse())
            return startSVGPoint;
        }
        /**明暗訊息輸出，輸入請用文字，會自動翻譯*/

                if (pending_deselect_rect && Math.abs(event.clientX - down_client.x) + Math.abs(event.clientY - down_client.y) > 3) {
                    pending_deselect_rect = false;

                showInfoAlphaDown("拖拉方塊");
                setActiveNameAndDetailBox(true);

                updateBlockLine(b);
                //console.log("move");
            }
            //移動畫布
            else if (mouse_event.buttons == 2) {
                showInfoAlphaDown("移動畫布");
                setActiveNameAndDetailBox(false);
                let startViewBox = svg1.getAttribute('viewBox').split(' ').map(n => parseFloat(n))

                //	2. 取得滑鼠當前 viewport 中 client 座標值
                let startClient = {
                    x: event.clientX,
                    y: event.clientY
                }

                //	3. 計算對應回去的 SVG 座標值
                let newSVGPoint = svg1.createSVGPoint()
                let CTM = svg1.getScreenCTM()
                newSVGPoint.x = startClient.x
                newSVGPoint.y = startClient.y
                let startSVGPoint = newSVGPoint.matrixTransform(CTM.inverse())

                //	4. 計算拖曳後滑鼠所在的 viewport client 座標值
                let moveToClient = {
                    x: event.clientX + event.movementX, //	movement 可以取得滑鼠位移量
                    y: event.clientY + event.movementY
                }

                //	5. 計算對應回去的 SVG 座標值
                newSVGPoint = svg1.createSVGPoint()
                CTM = svg1.getScreenCTM()
                newSVGPoint.x = moveToClient.x
                newSVGPoint.y = moveToClient.y
                let moveToSVGPoint = newSVGPoint.matrixTransform(CTM.inverse())

                //	6. 計算位移量
                let delta = {
                    dx: startSVGPoint.x - moveToSVGPoint.x,
                    dy: startSVGPoint.y - moveToSVGPoint.y
                }

                //	7. 設定新的 viewBox 值
                let moveToViewBox = `${startViewBox[0] + delta.dx} ${startViewBox[1] + delta.dy} ${startViewBox[2]} ${startViewBox[3]}`
                svg1.setAttribute('viewBox', moveToViewBox)
                //console.log(moveToViewBox)
            }
            //console.log(select_rect);
        }
        /**返回方塊中心，輸入請用實體*/

            var p = {};
            p.x = parseFloat(rect.getAttributeNS(null, 'x')) + (parseFloat(rect.getAttributeNS(null, 'width')) / 2);
            p.y = parseFloat(rect.getAttributeNS(null, 'y')) + (parseFloat(rect.getAttributeNS(null, 'height')) / 2);
            return p;
        }

        /**以文字大小與自型，取得文字實際px寬高*/
        function textSize(fontSize, fontFamily, text) {
            /*
        版权声明：本文为CSDN博主「zy1281539626」的原创文章，遵循 CC 4.0 BY-SA 版权协议，转载请附上原文出处链接及本声明。
        原文链接：https://blog.csdn.net/zy1281539626/article/details/78489279
        */
            var span = document.createElement("span");
            var result = {};
            result.width = span.offsetWidth;
            result.height = span.offsetHeight;
            span.style.visibility = "hidden";
            span.style.fontSize = fontSize;
            span.style.fontFamily = fontFamily;
            span.style.display = "inline-block";
            document.body.appendChild(span);
            if (typeof span.textContent != "undefined") {
                span.textContent = text;
            } else {
                span.innerText = text;
            }
            result.width = parseFloat(window.getComputedStyle(span).width) - result.width;
            result.height = parseFloat(window.getComputedStyle(span).height) - result.height;
            document.body.removeChild(span);
            return result;
        }
        /**[待確認]SVG轉png圖片，但我使用失敗(空白)*/
        function svgToPng(svg, pngWidth, pngHeight) {
            var serializer = new XMLSerializer();
            var source = '<?xml version="1.0" standalone="no"?>\r\n' + serializer.serializeToString(svg.cloneNode(true));
            var image = new Image;
            image.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
            var canvas = document.createElement("canvas");
            canvas.width = pngWidth;
            canvas.height = pngHeight;
            var context = canvas.getContext("2d");
            context.fillStyle = '#fff'; //設定儲存後的PNG 是白色的
            context.fillRect(0, 0, 10000, 10000);
            context.drawImage(image, 0, 0);
            var data = canvas.toDataURL("image/png");

            var a = document.createElement('a');
            a.style = "display:none;";
            a.href = data;
            a.download = 'myAwesomeSVG.png';
            a.innerHTML = 'download the png file';
            a.click();
        }

        /**下載SVG檔案，並且可以保存CSS樣式*/
        function exportSVG(svg) {
            // first create a clone of our svg node so we don't mess the original one
            var clone = svg.cloneNode(true);
            removeHighlight(clone);
            // parse the styles
            parseStyles(clone);

            // create a doctype
            var svgDocType = document.implementation.createDocumentType('svg', "-//W3C//DTD SVG 1.1//EN", "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd");
            // a fresh svg document
            var svgDoc = document.implementation.createDocument('http://www.w3.org/2000/svg', 'svg', svgDocType);
            // replace the documentElement with our clone 
            svgDoc.replaceChild(clone, svgDoc.documentElement);
            // get the data
            var svgData = (new XMLSerializer()).serializeToString(svgDoc);

            // now you've got your svg data, the following will depend on how you want to download it
            // e.g yo could make a Blob of it for FileSaver.js
            /*
            var blob = new Blob([svgData.replace(/></g, '>\n\r<')]);
            saveAs(blob, 'myAwesomeSVG.svg');
            */
            // here I'll just make a simple a with download attribute

            var a = document.createElement('a');
            a.style.display = "none";
            document.body.appendChild(a);
            a.href = 'data:image/svg+xml; charset=utf8, ' + encodeURIComponent(svgData.replace(/></g, '>\n\r<'));
            //location.href = 'data:image/svg+xml; charset=utf8, ' + encodeURIComponent(svgData.replace(/></g, '>\n\r<'));

        /**大概是轉譯CSS吧，我也不知道*/
        var parseStyles = function(svg) {
            var styleSheets = [];
            var i;
            // get the stylesheets of the document (ownerDocument in case svg is in <iframe> or <object>)
            var docStyles = svg.ownerDocument.styleSheets;

            // transform the live StyleSheetList to an array to avoid endless loop
            for (i = 0; i < docStyles.length; i++) {
                styleSheets.push(docStyles[i]);
            }

            if (!styleSheets.length) {
                return;
            }

            var defs = svg.querySelector('defs') || document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            if (!defs.parentNode) {
                svg.insertBefore(defs, svg.firstElementChild);
            }
            svg.matches = svg.matches || svg.webkitMatchesSelector || svg.mozMatchesSelector || svg.msMatchesSelector || svg.oMatchesSelector;


            // iterate through all document's stylesheets
            for (i = 0; i < styleSheets.length; i++) {
                var currentStyle = styleSheets[i]

                var rules;
                try {
                    rules = currentStyle.cssRules;
                } catch (e) {
                    continue;
                }
                // create a new style element
                var style = document.createElement('style');
                // some stylesheets can't be accessed and will throw a security error
                var l = rules && rules.length;
                // iterate through each cssRules of this stylesheet
                for (var j = 0; j < l; j++) {
                    // get the selector of this cssRules
                    var selector = rules[j].selectorText;
                    // probably an external stylesheet we can't access
                    if (!selector) {
                        continue;
                    }

                    // is it our svg node or one of its children ?
                    if ((svg.matches && svg.matches(selector)) || svg.querySelector(selector)) {

                        var cssText = rules[j].cssText;
                        // append it to our <style> node
                        style.innerHTML += cssText + '\n';
                    }
                }
                // if we got some rules
                if (style.innerHTML) {
                    // append the style node to the clone's defs
                    defs.appendChild(style);
                }
            }

        };
        /**把特殊字元轉成可接受代號，輸入為字串*/
        function escape(s) {
            return s.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/'/g, "&#39;")
                .replace(/"/g, "&quot;");
        }
